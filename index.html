<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chordbook · Guitar Chord Charts</title>
  <meta name="description" content="A fast, mobile-first guitar chord chart. Search any chord, browse every variation, hear it, and learn it with JustinGuitar.">
  <meta name="theme-color" content="#14110f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chordbook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:title" content="Chordbook · Guitar Chord Charts">
  <meta property="og:description" content="Every guitar chord, every variation, in your pocket.">
  <meta property="og:image" content="assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint to avoid a flash
    (function(){try{var s=JSON.parse(localStorage.getItem('cb.settings')||'{}');var t=s.theme||'auto';
      if(t==='auto'){t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';}
      document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <a class="brand display" href="#/" aria-label="Chordbook home">
        <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2a33a"/><stop offset="1" stop-color="#e0642f"/></linearGradient></defs><rect x="6" y="6" width="108" height="108" rx="28" fill="url(#lg)"/><g stroke="#1a120a" stroke-width="3" stroke-linecap="round"><line x1="30" y1="34" x2="90" y2="34" stroke-width="6"/><line x1="30" y1="52" x2="90" y2="52"/><line x1="30" y1="70" x2="90" y2="70"/><line x1="30" y1="88" x2="90" y2="88"/><line x1="30" y1="34" x2="30" y2="96"/><line x1="42" y1="34" x2="42" y2="96"/><line x1="54" y1="34" x2="54" y2="96"/><line x1="66" y1="34" x2="66" y2="96"/><line x1="78" y1="34" x2="78" y2="96"/><line x1="90" y1="34" x2="90" y2="96"/></g><g fill="#1a120a"><circle cx="54" cy="61" r="5.5"/><circle cx="78" cy="43" r="5.5"/><circle cx="90" cy="79" r="5.5"/></g></svg>
      </a>
      <form class="search-wrap" id="searchForm" role="search" autocomplete="off">
        <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" id="searchInput" type="search" inputmode="search" enterkeyhint="search" placeholder="Search chords, e.g. Am7, F#, Csus4" aria-label="Search chords" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="button" class="clear" id="searchClear" aria-label="Clear search" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </form>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottom-nav" id="nav" aria-label="Main">
      <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Chords</a>
      <a href="#/finder" data-nav="finder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="2.2" fill="currentColor" stroke="none"/><circle cx="17" cy="18" r="2.2" fill="currentColor" stroke="none"/></svg>Finder</a>
      <a href="#/progression" data-nav="progression"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V6M10 18v-8M16 18V9M22 18V4"/></svg>Progression</a>
      <a href="#/favorites" data-nav="favorites"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Saved</a>
      <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>Settings</a>
    </nav>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="data/chords.js"></script>
  <script src="data/videos.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
